<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="dramaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="50%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9F1239" />
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2A101C" />
      <stop offset="100%" stop-color="#0B0B0F" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)" />
  <rect width="512" height="512" rx="128" fill="none" stroke="#E11D48" stroke-width="6" stroke-opacity="0.3" />
  <g filter="url(#glow)" transform="translate(106, 106)">
    <!-- Stylized dramatic XOXO emblem -->
    <path d="M40 40 L260 260 M260 40 L40 260" stroke="url(#dramaGrad)" stroke-width="48" stroke-linecap="round" />
    <circle cx="150" cy="150" r="30" fill="#0B0B0F" stroke="url(#dramaGrad)" stroke-width="20" />
  </g>
</svg>
