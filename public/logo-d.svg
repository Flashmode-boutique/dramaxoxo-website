<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="dxBg" cx="30%" cy="20%" r="95%">
      <stop offset="0%" stop-color="#24101E" />
      <stop offset="60%" stop-color="#120A16" />
      <stop offset="100%" stop-color="#07040A" />
    </radialGradient>
    
    <!-- Outer Border Glow -->
    <linearGradient id="dxBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E63" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#D946EF" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.3" />
    </linearGradient>

    <!-- Vertical Spine Gradient (Stem of the D) -->
    <linearGradient id="dxStem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF" />
      <stop offset="25%" stop-color="#FF2E63" />
      <stop offset="85%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9F1239" />
    </linearGradient>

    <!-- Dynamic Curved Arch Gradient (Loop of the D) -->
    <linearGradient id="dxArch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366" />
      <stop offset="35%" stop-color="#E11D48" />
      <stop offset="70%" stop-color="#C026D3" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Inner Core Play / Drama Chevron Flare -->
    <linearGradient id="dxPlay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FDA4AF" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="dxGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Container Box with Rounded Squircle Background -->
  <rect x="4" y="4" width="192" height="192" rx="46" fill="url(#dxBg)" stroke="url(#dxBorder)" stroke-width="2.5" />

  <!-- Stylized DramaXoxo "D" Emblem -->
  <g filter="url(#dxGlow)">
    <!-- 1. Left Vertical Stem (Modern Rounded Column) -->
    <rect x="48" y="42" width="22" height="116" rx="11" fill="url(#dxStem)" />

    <!-- 2. Sweeping Outer Ribbon Arch of the "D" -->
    <path d="M 60 42 
             H 110 
             C 146 42, 166 66, 166 100 
             C 166 134, 146 158, 110 158 
             H 60" 
          fill="none" 
          stroke="url(#dxArch)" 
          stroke-width="22" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- 3. Inner Video Play Triangle / Dramatic Core Chevron -->
    <polygon points="96,82 128,100 96,118" fill="url(#dxPlay)" />

    <!-- 4. Precision Gem / Light Sparkle Accent at top corner -->
    <circle cx="60" cy="52" r="4.5" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>
