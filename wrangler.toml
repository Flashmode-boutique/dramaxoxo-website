name = "dramaxoxo-website"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "dramaxoxo-db"
database_id = "dramaxoxo-d1-production"
migrations_dir = "./migrations"

